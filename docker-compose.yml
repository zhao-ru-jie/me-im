# IM 集群演示用中间件：MongoDB（消息/群/关系链等持久化真相，缺省存储形态）
#                    + Redis（发号/幂等/离线队列/路由/在线态等热路径共享状态）
#                    + Nacos（节点 gRPC 地址动态发现）
# 启动： docker compose up -d
# 停止： docker compose down
services:
  # 持久化真相：im.storage=mongodb（缺省）。历史消息不能只落在 Redis 上——
  # key 会过期、主从切换会丢一段内存，而消息历史丢一条就是不可恢复的用户数据。
  mongodb:
    image: mongo:7
    container_name: me-im-mongo
    ports:
      - "27017:27017"
    # 不启用认证，与 application.yml 里 im.mongo.uri 的默认值一致
    command: ["--bind_ip_all"]
    volumes:
      - im-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 热路径共享状态：发号（seq）、幂等、离线队列、游标/水位、网关路由、在线态。
  # 这些都不是「唯一真相」，Redis 故障时各有本地降级（见 RedisDegrade）。
  redis:
    image: redis:7-alpine
    container_name: me-im-redis
    ports:
      - "6379:6379"
    # 不设置密码，与 application.yml 默认配置一致
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Nacos（独立模式）：用于演示「节点 gRPC 地址动态发现」。
  # 不启用 Nacos 也能跑（默认 im.nacos.enabled=false，转发回退为直接用 nodeId）。
  # 启用方式：启动时设置环境变量 IM_NACOS_ENABLED=true IM_NACOS_ADDR=127.0.0.1:8848
  nacos:
    image: nacos/nacos-server:v2.5.1
    container_name: me-im-nacos
    environment:
      - MODE=standalone
      - NACOS_AUTH_ENABLE=false
    ports:
      - "8848:8848"   # Nacos HTTP 控制台 / 配置 / 注册发现主端口
      - "9848:9848"   # Nacos 2.x gRPC 客户端端口（nacos-client SDK 需要）
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: on-failure

volumes:
  im-mongo-data:
